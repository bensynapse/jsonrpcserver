site_name: jsonrpcserver
site_description: Process incoming JSON-RPC 2.0 requests in Python
site_url: https://bensynapse.github.io/jsonrpcserver/
repo_url: https://github.com/bensynapse/jsonrpcserver
repo_name: bensynapse/jsonrpcserver
edit_uri: edit/main/docs/
copyright: >-
  jsonrpcserver is MIT licensed. Created by Beau Barker. Maintained by
  <a href="https://synapsereality.io">Synapse Research</a>.
theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
extra:
  # The version these docs describe while it isn't on PyPI yet. It shows a
  # banner on every page. Remove it when that version is released (see
  # RELEASING.md).
  unreleased: "5.0.10"
  pypi_version: "5.0.9"
  social_image: assets/social-card.png
  # Ownership tokens for Google Search Console and Bing Webmaster Tools.
  # Both services re-check them, so leave them in after verification.
  google_site_verification: 5mHS0iCWy8mBpJ2XYFljYI1E2r6ew3nz55dVjZJAoZQ
  bing_site_verification: 284F7E6020A3E99F2916C1E3DE4F175D
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: list
            heading_level: 3
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
extra_css:
  - assets/extra.css
extra_javascript:
  - assets/copy-without-prompts.js
  - assets/a11y.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      # Adds language-pycon etc., which copy-without-prompts.js looks for.
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - tables
  - toc:
      permalink: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
nav:
  - Home: index.md
  - Guide:
      - Methods: methods.md
      - Dispatch: dispatch.md
      - Notifications and batches: batches.md
      - Async: async.md
      - Errors and logging: errors.md
      - Context: context.md
      - Validation: validation.md
      - Typing: typing.md
      - Testing: testing.md
      - Threads: threads.md
  - Frameworks:
      - Overview: examples.md
      - http.server and serve(): frameworks/http-server.md
      - Flask: frameworks/flask.md
      - Werkzeug: frameworks/werkzeug.md
      - Django: frameworks/django.md
      - FastAPI: frameworks/fastapi.md
      - aiohttp: frameworks/aiohttp.md
      - Sanic: frameworks/sanic.md
      - Tornado: frameworks/tornado.md
      - websockets: frameworks/websockets.md
      - ZeroMQ: frameworks/zeromq.md
      - Socket.IO: frameworks/socketio.md
  - Security: security.md
  - API reference: reference.md
  - Migration: migration.md
  - FAQ: faq.md
  - Roadmap: roadmap.md
  - Project:
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Security policy: security-policy.md
      - License: license.md
      - jsonrpcclient: https://bensynapse.github.io/jsonrpcclient/
