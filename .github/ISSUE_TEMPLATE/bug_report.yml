name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the code you ran, what you expected and what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: jsonrpcserver version
      placeholder: "5.0.9"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13"
    validations:
      required: true
