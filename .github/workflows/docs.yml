name: Docs

# The docs site has one copy of the docs per release line, and the Docs
# workflow on main builds all of them. A 5.x release tag starts that workflow,
# so it rebuilds 5.x without removing the 6.0 docs. RELEASING.md on main
# explains how the site is built.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Run the Docs workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
