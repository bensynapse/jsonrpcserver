name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run. On main each commit
  # gets its own group, so no commit there is left with cancelled checks.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python }})
    # Pinned: Python 3.8 and 3.9 builds are not available for ubuntu-26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Show interpreter
        run: python -c "import sys, sysconfig; print(sys.version); print('free-threaded:', bool(sysconfig.get_config_var('Py_GIL_DISABLED')))"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements/test.txt
      - name: Tests with coverage gate
        run: python -m pytest --cov --cov-report=term-missing

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e . -r requirements/lint.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy
      - run: pyright
      - name: No links to hijacked domains anywhere in the repo
        run: |
          # The second pattern is the previous author's blog, which now redirects to spam.
          # The FAQ names the old domains, as plain text, so readers recognise them.
          # tests/test_docs.py checks that they're never links there.
          if git grep -n -I -i -E 'jsonrpc(client|server)\.com|composed\.blog' -- ':!.github/scripts/check_metadata.py' ':!docs/faq.md'; then
            echo "::error::Remove the links above. Those domains no longer belong to the project."
            exit 1
          fi

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/build.txt
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: check-wheel-contents dist/*.whl
      - name: Metadata must not link to hijacked domains
        run: python .github/scripts/check_metadata.py dist/*

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e . -r requirements/docs.txt -r requirements/examples.txt
      - run: mkdocs build --strict
      - name: Examples in the README and docs, with every optional library installed
        run: |
          for f in README.md $(find docs -name '*.md' | sort); do
            python tests/doc_examples.py "$f"
          done
      - name: Start each example server and send it requests
        run: python docs/examples/check_examples.py

  site:
    # The built docs in a browser: accessibility (axe-core), links and anchors,
    # and pages that scroll sideways. See .github/scripts/check_site.py.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/docs.txt -r requirements/site.txt
      - run: python -m playwright install --with-deps chromium
      - run: mkdocs build --strict
      - name: Download axe-core and check its hash
        env:
          AXE_VERSION: "4.14.0"
          AXE_SHA512: "9WTZxEjsZ7b13TH8JPmbV2z8CHbl80/2hm3XPEG4JgNdQLK81IBRXmSxHfMAOkSqQeRxT/0dwNDz2GOm3zzpcQ=="
        run: |
          curl -sSfL -o axe.tgz "https://registry.npmjs.org/axe-core/-/axe-core-$AXE_VERSION.tgz"
          echo "$AXE_SHA512" | base64 -d > expected.bin
          openssl dgst -sha512 -binary axe.tgz | cmp - expected.bin
          tar -xzf axe.tgz package/axe.min.js
      - run: python .github/scripts/check_site.py site package/axe.min.js

  ci-ok:
    name: CI OK
    if: always()
    needs: [test, lint, package, docs, site]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || exit 1
          done
