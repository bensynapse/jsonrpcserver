name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python }})
    # Pinned: Python 3.8 and 3.9 builds are not available for ubuntu-26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Show interpreter
        run: python -c "import sys, sysconfig; print(sys.version); print('free-threaded:', bool(sysconfig.get_config_var('Py_GIL_DISABLED')))"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements/test.txt
      - name: Tests with coverage gate
        run: python -m pytest --cov --cov-report=term-missing

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e . -r requirements/lint.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy
      - run: pyright
      - name: No links to hijacked domains anywhere in the repo
        run: |
          # The second pattern is the previous author's blog, which now redirects to spam.
          if git grep -n -I -i -E 'jsonrpc(client|server)\.com|composed\.blog' -- ':!.github/scripts/check_metadata.py'; then
            echo "::error::Remove the links above. Those domains no longer belong to the project."
            exit 1
          fi

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/build.txt
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: check-wheel-contents dist/*.whl
      - name: Metadata must not link to hijacked domains
        run: python .github/scripts/check_metadata.py dist/*

  ci-ok:
    name: CI OK
    if: always()
    needs: [test, lint, package]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || exit 1
          done
