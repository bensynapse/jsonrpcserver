# Run the tests on every interpreter you have installed:
#   pip install tox && tox
# CI does not use this file; see .github/workflows/ci.yml.

[tox]
envlist = py38,py39,py310,py311,py312,py313,py314,py314t
skip_missing_interpreters = true

[testenv]
setenv = PYTHONDONTWRITEBYTECODE=1
deps = -r requirements/test.txt
commands = pytest --cov --cov-report=term-missing {posargs}
