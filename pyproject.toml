[build-system]
requires = ["flit_core>=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "jsonrpcserver"
dynamic = ["version"]
description = "Process incoming JSON-RPC 2.0 requests in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Beau Barker", email = "beau@explodinglabs.com"},
]
maintainers = [
    {name = "Synapse Research", email = "ben@synapsereality.io"},
]
keywords = ["json-rpc", "jsonrpc", "json-rpc-2.0", "rpc", "server"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# None. 6.0 checks requests itself (jsonrpcserver/validator.py).
dependencies = []

[project.urls]
Homepage = "https://bensynapse.github.io/jsonrpcserver/"
Documentation = "https://bensynapse.github.io/jsonrpcserver/"
Repository = "https://github.com/bensynapse/jsonrpcserver"
Issues = "https://github.com/bensynapse/jsonrpcserver/issues"
Changelog = "https://bensynapse.github.io/jsonrpcserver/changelog/"

[project.optional-dependencies]
test = [
    "hypothesis",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.flit.sdist]
include = [
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "RELEASING.md",
    "SECURITY.md",
    "docs/",
    "mkdocs.yml",
    "overrides/",
    "requirements/",
    "tests/",
    "tox.ini",
]

[tool.ruff]
target-version = "py311"


[tool.ruff.format]
# Their code blocks include files with "--8<--" lines, which aren't Python.
exclude = ["docs/index.md", "docs/frameworks/*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Request and response fixtures are easier to read on one line.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["jsonrpcserver", "tests"]

[tool.pyright]
include = ["jsonrpcserver", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["jsonrpcserver"]

[tool.coverage.report]
# The "..." body of an overload is not code to cover.
exclude_also = ["@overload"]
fail_under = 100
show_missing = true
