[tool.ruff]
target-version = "py38"

[tool.ruff.format]
# Its code blocks are "--8<--" include lines, not Python.
exclude = ["docs/examples.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Request and response fixtures are easier to read on one line.
"tests/*" = ["E501"]

[tool.mypy]
# mypy only accepts 3.10 or later here. pyright checks the 3.8 target.
python_version = "3.10"
strict = true
files = ["jsonrpcserver", "tests"]

[[tool.mypy.overrides]]
# oslash has inline annotations but no py.typed marker, so mypy would treat
# Result and Response as Any without this.
module = ["oslash", "oslash.*"]
follow_untyped_imports = true

[tool.pyright]
include = ["jsonrpcserver", "tests"]
pythonVersion = "3.8"
typeCheckingMode = "strict"
# oslash keeps the value of Left and Right in _error and _value, with no public
# accessor, so the library has to read them.
reportPrivateUsage = false
# oslash ships inline annotations, which pyright reads, but no stub files.
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jsonrpcserver"]

[tool.coverage.report]
# Python 3.8 counts the "..." body of an overload as a branch.
exclude_also = ["@overload"]
fail_under = 100
show_missing = true
